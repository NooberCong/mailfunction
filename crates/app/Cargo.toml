[package]
name = "mailfunction"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mailfunction-core = { path = "../core" }
raw-window-handle = "0.6"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06"] }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57"

[dev-dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
png = "0.18"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Storage_Xps"] }
tokio = { version = "1", features = ["net", "rt"] }

# Needs Dovecot and opens a window, so plain `cargo test` leaves it out.
[[test]]
name = "live"
harness = false
test = false

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
