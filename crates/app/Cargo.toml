[package]
name = "mailfunction"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mailfunction-core = { path = "../core" }
raw-window-handle = "0.6"
rfd = "0.16"
unicode-normalization = "0.1"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06", "unstable-winit-030"] }
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wry = "0.57"

[dev-dependencies]
mail-parser = "=1.0.1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
png = "0.18"
rusqlite = "0.41"
ureq = "3"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_HiDpi"] }
tokio = { version = "1", features = ["net", "rt"] }

# Needs Dovecot and opens a window, so plain `cargo test` leaves it out.
[[test]]
name = "live"
harness = false
test = false

# Opens a window.
[[test]]
name = "images"
harness = false
test = false

# Opens a window.
[[test]]
name = "composer"
harness = false
test = false

# Opens a window and the save dialog.
[[test]]
name = "window"
harness = false
test = false

# Needs Dovecot and mailpit and opens a window, but leaves notifications alone.
[[test]]
name = "editor"
harness = false
test = false

# Opens a window, and needs the real executable.
[[test]]
name = "tray"
harness = false
test = false

# Opens a window and reaches the web for logos. Takes the README's pictures.
[[test]]
name = "showcase"
harness = false
test = false

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
