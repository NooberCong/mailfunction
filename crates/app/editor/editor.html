<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compose</title>
<style>
@font-face { font-family: "Be Vietnam Pro"; font-weight: 400; src: url(/regular.ttf); }
@font-face { font-family: "Be Vietnam Pro"; font-weight: 600; src: url(/semibold.ttf); }
:root {
  --sheet: #ffffff; --text: #231417; --muted: #7d6a6e; --line: #f1e8e9; --hover: #faf5f5;
  --selected: #fcecee; --accent: #c4122f; --faint: #f0e4e5;
  --font: "Be Vietnam Pro", "Segoe UI", sans-serif; --size: 14px; --gutter: 36px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--sheet); color: var(--text); font: var(--size)/1.55 var(--font);
}
#page { flex: 1; min-height: 0; overflow-y: auto; padding: 14px var(--gutter) 24px; }
#body { min-height: 100%; outline: none; overflow-wrap: anywhere; caret-color: var(--accent); }
#body ::selection { background: var(--selected); }
#body p { margin: 0 0 .6em; }
#body h1, #body h2 { margin: .6em 0 .3em; line-height: 1.25; }
#body ul, #body ol { margin: .3em 0; padding-left: 1.6em; }
#body blockquote { margin: .5em 0; padding-left: 12px; border-left: 2px solid var(--faint); color: var(--muted); }
#body a { color: var(--accent); }
#body img { max-width: 100%; height: auto; border-radius: 4px; }
#body img.picked { outline: 2px solid var(--accent); }
.signature, .quoted { color: var(--muted); }
/* Marked text keeps its dark ink on a dark sheet, here only: nothing of this is sent. */
:root[data-dark] #body [style*="background-color"] { color: #231417; }

#bar {
  flex: none; display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
  padding: 8px calc(var(--gutter) - 8px) 12px var(--gutter); border-top: 1px solid var(--line);
  user-select: none;
}
#bar button {
  all: unset; position: relative; width: 28px; height: 30px; border-radius: 7px; cursor: pointer;
  display: grid; place-items: center; color: var(--muted);
}
#bar button:hover { background: var(--hover); }
#bar button.on { background: var(--selected); color: var(--accent); }
#bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#bar svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#bar #send {
  width: 92px; height: 34px; margin-right: 8px; border-radius: 9px; background: var(--accent); color: var(--sheet);
  font-weight: 600; text-align: center;
}
#bar #send:hover { background: var(--accent); opacity: .88; }
#bar .fill { flex: 1; }
#bar .gap { width: 1px; height: 16px; margin: 0 5px; background: var(--faint); }
#bar .swatch { position: absolute; left: 8px; right: 8px; bottom: 5px; height: 2.5px; border-radius: 2px; background: currentColor; }

#tip {
  position: fixed; z-index: 3; padding: 4px 8px; border-radius: 6px; pointer-events: none; white-space: nowrap;
  background: var(--text); color: var(--sheet); font-size: 12px; opacity: 0; transition: opacity 90ms;
}
#tip.shown { opacity: 1; }

.menu {
  position: fixed; z-index: 2; padding: 4px; border-radius: 10px; display: none;
  background: var(--sheet); border: 1px solid var(--faint); box-shadow: 0 6px 20px #0000001f;
}
.menu.open { display: block; }
.menu button {
  all: unset; display: block; min-width: 132px; padding: 6px 10px; border-radius: 7px; cursor: pointer; color: var(--text);
}
.menu button:hover, .menu button.on { background: var(--hover); }
#colours { padding: 8px; }
#colours .title { color: var(--muted); font-size: 12px; margin: 2px 2px 6px; }
#colours .row { display: grid; grid-template-columns: repeat(8, 22px); gap: 5px; margin-bottom: 8px; }
#colours .row:last-child { margin-bottom: 0; }
#colours button { all: unset; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; box-shadow: inset 0 0 0 1px #00000018; display: grid; place-items: center; color: var(--muted); }
#colours button:hover { outline: 2px solid var(--muted); outline-offset: 1px; }
#link { padding: 10px; width: 320px; }
#link input {
  all: unset; display: block; box-sizing: border-box; width: 100%; padding: 6px 2px; border-bottom: 1px solid var(--line); color: var(--text);
}
#link input:focus { border-color: var(--accent); }
#link input::placeholder { color: var(--muted); }
#link .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
#link .actions button { min-width: 0; padding: 4px 10px; color: var(--muted); }
#link .actions button.primary { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div id="page"><div id="body" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Message"></div></div>

<div id="bar" role="toolbar" aria-label="Formatting">
  <button id="send" data-tell="send" data-tip="Send (Ctrl+Enter)">Send</button>
  <button data-menu="fonts" data-tip="Font"><svg viewBox="0 0 24 24"><path d="M5 20L12 4l7 16M8 14h8"/></svg></button>
  <button data-menu="sizes" data-tip="Size"><svg viewBox="0 0 24 24"><path d="M3 18l5-12 5 12M4.7 14h6.6M15 18l3.5-8 3.5 8M16 15.5h5"/></svg></button>
  <span class="gap"></span>
  <button data-do="bold" data-tip="Bold (Ctrl+B)"><svg viewBox="0 0 24 24"><path d="M7 4.5h6a3.75 3.75 0 0 1 0 7.5H7zM7 12h7a3.75 3.75 0 0 1 0 7.5H7z"/></svg></button>
  <button data-do="italic" data-tip="Italic (Ctrl+I)"><svg viewBox="0 0 24 24"><path d="M10 4.5h8M6 19.5h8M14 4.5l-4 15"/></svg></button>
  <button data-do="underline" data-tip="Underline (Ctrl+U)"><svg viewBox="0 0 24 24"><path d="M7 4v8a5 5 0 0 0 10 0V4M5 20.5h14"/></svg></button>
  <button data-do="strikeThrough" data-tip="Strikethrough (Ctrl+Shift+X)"><svg viewBox="0 0 24 24"><path d="M4 12h16M16.5 7A4.5 3.5 0 0 0 12 4.5C9 4.5 7.5 6 7.5 8c0 1.5.8 2.8 2.5 4M8 17a4.5 3.5 0 0 0 4.2 2.5c3 0 4.6-1.6 4.6-3.6 0-.7-.2-1.4-.5-1.9"/></svg></button>
  <button data-menu="colours" data-tip="Colour"><svg viewBox="0 0 24 24"><path d="M7 16L12 4l5 12M8.6 12h6.8"/></svg><span class="swatch" id="swatch"></span></button>
  <span class="gap"></span>
  <button data-do="insertUnorderedList" data-tip="Bulleted list (Ctrl+Shift+8)"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6v.01M4.5 12v.01M4.5 18v.01"/></svg></button>
  <button data-do="insertOrderedList" data-tip="Numbered list (Ctrl+Shift+7)"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 4.5l1.5-1v5M3.8 14.5c.2-1.5 2.7-1.5 2.7.2 0 1-2.7 2-2.7 3.3h2.8"/></svg></button>
  <button data-menu="aligns" data-tip="Align and indent"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10.5h10M4 15h16M4 19.5h10"/></svg></button>
  <button data-block="blockquote" data-tip="Quote (Ctrl+Shift+9)"><svg viewBox="0 0 24 24"><path d="M9.5 7C6.5 8 5 10.5 5 14v3h5v-5H6.6M19 7c-3 1-4.5 3.5-4.5 7v3h5v-5h-3.4"/></svg></button>
  <span class="gap"></span>
  <button data-link data-tip="Link (Ctrl+K)"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 6 .4l3-3a4 4 0 0 0-5.7-5.7l-1.6 1.6M14 10a4 4 0 0 0-6-.4l-3 3a4 4 0 0 0 5.7 5.7l1.6-1.6"/></svg></button>
  <button data-image data-tip="Picture"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 16l5-5 4 4 2.5-2.5L20 17M15 9v.01"/></svg></button>
  <button data-do="removeFormat" data-tip="Clear formatting (Ctrl+\)"><svg viewBox="0 0 24 24"><path d="M6 5h13M12.5 5l-3 14M7 19h5M4 4l16 16"/></svg></button>
  <span class="fill"></span>
  <button data-tell="attach-files" data-tip="Attach files"><svg viewBox="0 0 24 24"><path d="M16.5 7.5v9a4.5 4.5 0 0 1-9 0V6a3 3 0 0 1 6 0v9.5a1.5 1.5 0 0 1-3 0V8"/></svg></button>
  <button data-tell="discard" data-tip="Discard draft"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button>
</div>

<div class="menu" id="fonts" role="menu"></div>
<div class="menu" id="sizes" role="menu"></div>
<div class="menu" id="aligns" role="menu"></div>
<div class="menu" id="colours" role="menu"></div>
<div class="menu" id="link">
  <input id="link-text" placeholder="Text" aria-label="Text">
  <input id="link-url" placeholder="Address" aria-label="Address" spellcheck="false">
  <div class="actions"><button id="link-remove">Remove</button><button id="link-save" class="primary">Save</button></div>
</div>
<input id="picker" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
<div id="tip" role="tooltip"></div>

<script src="/editor.js"></script>
</body>
</html>
