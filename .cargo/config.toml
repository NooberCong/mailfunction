# WebView2 and the Windows SDK tooling are only first-class on MSVC; this machine defaults to GNU.
[build]
target = "x86_64-pc-windows-msvc"

# Builds in the C runtime, as a clean Windows has no vcruntime140.dll for the app to start with.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
