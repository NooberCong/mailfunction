[package]
name = "webview-host"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
futures-channel = "0.3"
raw-window-handle = "0.6"
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "renderer-femtovg", "raw-window-handle-06"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
wry = "0.57"

[build-dependencies]
slint-build = "1.18"
